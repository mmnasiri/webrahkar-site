<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">منطق کلی جریان در بارانداز عبوری</title>
  <desc id="desc">محموله از درهای دریافت وارد می‌شود، شناسایی و بر اساس مقصد تفکیک یا تجمیع می‌شود و سپس از درهای ارسال به مقصدهای بعدی حرکت می‌کند.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#edf4f7"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fbfc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#168f87"/>
    </marker>
    <style>
      .fa { font-family: Vazirmatn, Tahoma, sans-serif; fill: #17243a; }
      .muted { fill: #647489; }
      .label { font-size: 28px; font-weight: 800; }
      .small { font-size: 20px; }
      .tiny { font-size: 17px; }
    </style>
  </defs>
  <rect width="1440" height="810" rx="30" fill="url(#bg)"/>
  <text class="fa muted small" x="720" y="82" text-anchor="middle">هماهنگی سه مرحله برای انتقال سریع‌تر کالا</text>
  <text class="fa label" x="720" y="135" text-anchor="middle">منطق کلی جریان در بارانداز عبوری</text>
  <g stroke="#dce7ed" stroke-width="2">
    <rect x="990" y="205" width="350" height="390" rx="26" fill="url(#stage)"/>
    <rect x="545" y="205" width="350" height="390" rx="26" fill="url(#stage)"/>
    <rect x="100" y="205" width="350" height="390" rx="26" fill="url(#stage)"/>
  </g>
  <g>
    <rect x="1060" y="250" width="210" height="10" rx="5" fill="#c8d8e2"/>
    <rect x="1035" y="275" width="18" height="115" rx="5" fill="#dce7ed"/>
    <rect x="1090" y="275" width="18" height="115" rx="5" fill="#dce7ed"/>
    <rect x="1145" y="275" width="18" height="115" rx="5" fill="#dce7ed"/>
    <rect x="1200" y="275" width="18" height="115" rx="5" fill="#dce7ed"/>
    <rect x="1255" y="275" width="18" height="115" rx="5" fill="#dce7ed"/>
    <g fill="#e8b66b" stroke="#c79245" stroke-width="2">
      <rect x="1054" y="307" width="52" height="48" rx="5"/>
      <rect x="1126" y="307" width="52" height="48" rx="5"/>
      <rect x="1198" y="307" width="52" height="48" rx="5"/>
    </g>
    <g stroke="#c79245" stroke-width="2" fill="none">
      <path d="M1080 307 v48 M1054 330 h52"/>
      <path d="M1152 307 v48 M1126 330 h52"/>
      <path d="M1224 307 v48 M1198 330 h52"/>
    </g>
    <text class="fa label" x="1165" y="445" text-anchor="middle">دریافت محموله</text>
    <text class="fa small muted" x="1165" y="482" text-anchor="middle">تخلیه و شناسایی</text>
    <text class="fa tiny muted" x="1165" y="527" text-anchor="middle">ثبت زمان و اطلاعات کالا</text>
  </g>
  <g>
    <rect x="600" y="275" width="240" height="16" rx="8" fill="#c9dbe3"/>
    <rect x="600" y="330" width="240" height="16" rx="8" fill="#c9dbe3"/>
    <rect x="600" y="385" width="240" height="16" rx="8" fill="#c9dbe3"/>
