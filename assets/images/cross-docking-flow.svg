      <rect x="700" y="310" width="45" height="30" rx="4"/>
      <rect x="775" y="365" width="45" height="30" rx="4"/>
    </g>
    <g stroke="#168f87" stroke-width="2" fill="none">
      <path d="M647 255 v30 M625 270 h45"/>
      <path d="M722 310 v30 M700 325 h45"/>
      <path d="M797 365 v30 M775 380 h45"/>
    </g>
    <path d="M620 420 C680 450 760 450 820 420" fill="none" stroke="#168f87" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 10"/>
    <text class="fa label" x="720" y="485" text-anchor="middle">تفکیک و تجمیع</text>
    <text class="fa small muted" x="720" y="522" text-anchor="middle">تخصیص بر اساس مقصد</text>
    <text class="fa tiny muted" x="720" y="555" text-anchor="middle">با توقف و نگهداری محدود</text>
  </g>
  <g>
    <rect x="155" y="270" width="240" height="18" rx="9" fill="#c9dbe3"/>
    <rect x="155" y="325" width="240" height="18" rx="9" fill="#c9dbe3"/>
    <rect x="155" y="380" width="240" height="18" rx="9" fill="#c9dbe3"/>
    <g fill="#b8d7d1" stroke="#168f87" stroke-width="2">
      <rect x="175" y="247" width="47" height="28" rx="4"/>
      <rect x="250" y="302" width="47" height="28" rx="4"/>
      <rect x="325" y="357" width="47" height="28" rx="4"/>
    </g>
    <g stroke="#168f87" stroke-width="2" fill="none">
      <path d="M198 247 v28 M175 261 h47"/>
      <path d="M273 302 v28 M250 316 h47"/>
      <path d="M348 357 v28 M325 371 h47"/>
    </g>
    <text class="fa label" x="275" y="455" text-anchor="middle">ارسال خروجی</text>
    <text class="fa small muted" x="275" y="492" text-anchor="middle">بارگیری در مسیر مناسب</text>
    <text class="fa tiny muted" x="275" y="530" text-anchor="middle">حرکت به فروشگاه یا مقصد بعدی</text>
  </g>
  <g fill="none" stroke="#168f87" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M980 395 H915"/>
    <path d="M535 395 H470"/>
  </g>
  <g>
    <rect x="605" y="650" width="230" height="75" rx="18" fill="#e0f4f0" stroke="#b6e5dc" stroke-width="2"/>
    <text class="fa small" x="720" y="680" text-anchor="middle" font-weight="800">اصل کلیدی</text>
    <text class="fa tiny" x="720" y="706" text-anchor="middle">هماهنگی زمان و ظرفیت</text>
  </g>
  <text class="fa tiny muted" x="720" y="770" text-anchor="middle">شمای مفهومی است؛ چیدمان واقعی مراکز و مسیر کالاها می‌تواند متفاوت باشد.</text>
