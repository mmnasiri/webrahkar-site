name: Temporary refresh of last-mile and resilience photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-lastmile-resilience-photos.yml"
      - ".github/refresh-photo-trigger.txt"
permissions:
  contents: write
jobs:
  refresh-photos:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and optimize selected images
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import requests
          from PIL import Image, ImageOps

          photos = {
              "knowledge-last-mile.webp": "https://images.unsplash.com/photo-1783529748743-086e264b30a1?auto=format&fit=crop&fm=jpg&w=2200&h=1238&q=90",
              "knowledge-resilience.webp": "https://images.unsplash.com/photo-1770710195407-b31627609c0b?auto=format&fit=crop&fm=jpg&w=2200&h=1238&q=90"
          }
          folder = Path("assets/images")
          for name, url in photos.items():
              response = requests.get(url, timeout=60, headers={"User-Agent": "Mozilla/5.0"})
              response.raise_for_status()
              im = Image.open(BytesIO(response.content))
              im = ImageOps.exif_transpose(im).convert("RGB")
              im = ImageOps.fit(im, (1440, 810), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              out = folder / name
              im.save(out, "WEBP", quality=84, method=6)
              print(f"{out}: {out.stat().st_size} bytes; {im.size}")
          PY
      - name: Commit photo replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/knowledge-last-mile.webp assets/images/knowledge-resilience.webp
          git commit -m "Replace last-mile and resilience guide photos"
          git push origin HEAD:main
