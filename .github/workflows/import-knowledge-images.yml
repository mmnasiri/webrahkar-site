name: Import knowledge case-study images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-knowledge-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download source images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/knowledge-source assets/images
          curl -fLsS --retry 3 --max-time 90 -A "Mozilla/5.0" \
            "https://corporate.walmart.com/content/dam/corporate/images/newsroom/business/20160602/a-behind-the-scenes-look-at-how-walmart-delivers/distribution-center-bentonville_130151728439764214.jpg" \
            -o /tmp/knowledge-source/walmart.jpg
          curl -fLsS --retry 3 --max-time 90 -A "Mozilla/5.0" \
            "https://assets.aboutamazon.com/dims4/default/f137c03/2147483647/strip/true/crop/4000x2255%2B0%2B206/resize/1320x744%21/quality/90/?url=https%3A%2F%2Fassets.aboutamazon.com%2F69%2F8d%2Faff36cc440ceaa206dc4e806ee02%2F20250416-mucha-amazondnz3-213.jpg" \
            -o /tmp/knowledge-source/amazon.jpg
          curl -fLsS --retry 3 --max-time 90 -A "Mozilla/5.0" \
            "https://corporate.target.com/getmedia/143897d5-365a-4cb5-b13b-738cb0c6b73e/Sortation_Center_12.jpg" \
            -o /tmp/knowledge-source/target.jpg
          curl -fLsS --retry 3 --max-time 90 -A "Mozilla/5.0" \
            "https://i.insider.com/5e4415603b62b730a22969d5?auto=webp&format=jpeg&width=1200" \
            -o /tmp/knowledge-source/home-depot.jpg
          curl -fLsS --retry 3 --max-time 90 -A "Mozilla/5.0" \
            "https://mecaluxes.cdnwm.com/casos-practicos/ccv-almacena-miles-referencias-gestiona-miles-productos.1.1.jpg" \
            -o /tmp/knowledge-source/dots.jpg

      - name: Normalize and optimize images
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          src = Path("/tmp/knowledge-source")
          dst = Path("assets/images")
          for name in ("walmart", "amazon", "target", "home-depot", "dots"):
              path = src / f"{name}.jpg"
              with Image.open(path) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  im = ImageOps.fit(im, (1440, 810), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
                  out = dst / f"knowledge-{name}.webp"
                  im.save(out, "WEBP", quality=84, method=6)
                  print(f"{out}: {out.stat().st_size} bytes")
          PY

      - name: Commit optimized local assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/knowledge-*.webp
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "Add locally hosted case study images"
          git push
