name: One-time import of knowledge guide images
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-new-knowledge-images.yml"
      - ".github/image-import-trigger.txt"
permissions:
  contents: write
jobs:
  import-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and optimize selected Unsplash images
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import requests
          from PIL import Image, ImageOps

          assets = {
              "knowledge-last-mile.webp": {
                  "url": "https://images.unsplash.com/photo-1620455800201-7f00aeef12ed?fm=jpg&fit=crop&w=2000&h=1125&q=88",
                  "alt": "Delivery person loading cardboard boxes beside a delivery van"
              },
              "knowledge-omnichannel.webp": {
                  "url": "https://images.unsplash.com/photo-1764083079459-ddb9a615d50e?fm=jpg&fit=crop&w=2000&h=1125&q=88",
                  "alt": "Person shopping in a grocery store aisle"
              },
              "knowledge-resilience.webp": {
                  "url": "https://images.unsplash.com/photo-1721937127582-ed331de95a04?fm=jpg&fit=crop&w=2000&h=1125&q=88",
                  "alt": "Warehouse aisle with boxes and pallets"
              },
              "knowledge-circular.webp": {
                  "url": "https://images.unsplash.com/photo-1775673301865-11860d27573c?fm=jpg&fit=crop&w=2000&h=1125&q=88",
                  "alt": "Aerial view of a recycling plant and material recovery area"
              }
          }

          dest = Path("assets/images")
          dest.mkdir(parents=True, exist_ok=True)
          for filename, item in assets.items():
              path = dest / filename
              response = requests.get(item["url"], timeout=45, headers={"User-Agent": "Mozilla/5.0"})
              response.raise_for_status()
              image = Image.open(BytesIO(response.content))
              image = ImageOps.exif_transpose(image).convert("RGB")
              image = ImageOps.fit(image, (1440, 810), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              image.save(path, "WEBP", quality=84, method=6)
              print(f"{filename}: {path.stat().st_size} bytes, {image.size[0]}x{image.size[1]}")
          PY
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/knowledge-last-mile.webp assets/images/knowledge-omnichannel.webp assets/images/knowledge-resilience.webp assets/images/knowledge-circular.webp
          git commit -m "Add optimized images for four knowledge guides"
          git push origin HEAD:main
